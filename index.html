<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Department:Technical Department Report Form!</h1> 
  <form id=" myForm">
<label>Date:</label><input type="text"name="Date"required>
<label>Shift:</label><select>
  <option>Day</option>
  <option>Afternoon</option>
  <option>Night</option>
</select>
<button type="submit">Submit</button>
  </form>
  
<script>
  const form = document.getElementById('myForm');
  // Paste your Google Web App URL here
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzBtxMcybBpl7jhgqb9M8DWHgnlcTaM7eMCi5p25ZBUm07NbQFJPe_pHHXNI_pTGi8wmQ/exec'; 

  form.addEventListener('submit', e => {
    e.preventDefault();
    
    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => alert('Galatoomaa!'))
      .catch(error => console.error('Error!', error.message));
  });
</script>
</body>
</html>
